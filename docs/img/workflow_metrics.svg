<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" width="1000" height="382" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="382" fill="#000"/>
<text x="28" y="62" fill="#fff" font-size="34" font-weight="600">Structural brief vs short passes</text>
<text x="972" y="62" fill="#8a8a8a" font-size="15" text-anchor="end">same units, same day: nucamera and nuhgobj</text>
<line x1="28" y1="96" x2="972" y2="96" stroke="#222"/>
<text x="28" y="136" fill="#fff" font-size="19">New matched bytes per child-hour</text>
<rect x="400" y="121" width="5.7" height="5" rx="2.5" fill="#3a3a3a"/>
<rect x="400" y="132" width="220.0" height="5" rx="2.5" fill="#fff"/>
<text x="644" y="136" font-size="17"><tspan fill="#8a8a8a">374 B/h → </tspan><tspan fill="#fff">14,481 B/h</tspan></text>
<text x="972" y="140" fill="#fff" font-size="30" font-weight="500" text-anchor="end">39×</text>
<line x1="28" y1="160" x2="972" y2="160" stroke="#222"/>
<text x="28" y="200" fill="#fff" font-size="19">Exact-instruction gain per child-hour</text>
<rect x="400" y="185" width="51.0" height="5" rx="2.5" fill="#3a3a3a"/>
<rect x="400" y="196" width="220.0" height="5" rx="2.5" fill="#fff"/>
<text x="644" y="200" font-size="17"><tspan fill="#8a8a8a">324 insn/h → </tspan><tspan fill="#fff">1,397 insn/h</tspan></text>
<text x="972" y="204" fill="#fff" font-size="30" font-weight="500" text-anchor="end">4.3×</text>
<line x1="28" y1="224" x2="972" y2="224" stroke="#222"/>
<text x="28" y="264" fill="#fff" font-size="19">Compile-error rate of scored attempts</text>
<rect x="400" y="249" width="220.0" height="5" rx="2.5" fill="#3a3a3a"/>
<rect x="400" y="260" width="13.0" height="5" rx="2.5" fill="#fff"/>
<text x="644" y="264" font-size="17"><tspan fill="#8a8a8a">69.4% → </tspan><tspan fill="#fff">4.1%</tspan></text>
<text x="972" y="268" fill="#fff" font-size="30" font-weight="500" text-anchor="end">17×</text>
<line x1="28" y1="288" x2="972" y2="288" stroke="#222"/>
<rect x="28" y="348" width="30" height="6" rx="3" fill="#3a3a3a"/>
<text x="66" y="356" fill="#8a8a8a" font-size="14">before</text>
<rect x="140" y="348" width="30" height="6" rx="3" fill="#fff"/>
<text x="178" y="356" fill="#8a8a8a" font-size="14">after, drawn to the same scale</text>
<text x="972" y="356" fill="#8a8a8a" font-size="14" text-anchor="end">LSW1 decomp</text>
</svg>
