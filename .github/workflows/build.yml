name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python tooling
        run: |
          python3 -m compileall -q configure.py tools tests
          python3 -m unittest discover -s tests
          python3 configure.py
          mkdir -p artifacts
          python3 tools/symbols_to_map.py --all --output artifacts/GL5E4F.map
      - name: Check shell syntax
        run: bash -n build.sh tools/build_patched_dtk.sh tools/orig_crypt.sh

  retail:
    needs: tooling
    name: Retail comparison
    # Fork PRs cannot read the secret; same-repo PRs, pushes and dispatches can.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      readme: ${{ steps.readme.outputs.content }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Decrypt and verify retail DOL
        env:
          ORIG_KEY: ${{ secrets.ORIG_KEY }}
        run: bash tools/orig_crypt.sh decrypt
      - name: Compile candidates and generate report
        run: bash build.sh
      - name: Verifier regression tests on genuine ProDG objects
        env:
          VERIFY_FN_REQUIRE_RETAIL: "1"
        run: python3 -m unittest -v tests.test_verify_fn
      - name: Render current README progress
        id: readme
        run: |
          python3 tools/update_readme.py
          echo "content=$(base64 -w0 README.md)" >> "$GITHUB_OUTPUT"

  readme:
    name: Update README progress
    needs: [tooling, retail]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish or fast-forward checked README progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          README_CONTENT: ${{ needs.retail.outputs.readme }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, sys
          sys.path.insert(0, 'tools')
          from update_readme import publish
          publish(base64.b64decode(os.environ['README_CONTENT']).decode())
          PYCODE

  build:
    name: Build and report progress
    needs: tooling
    runs-on: ubuntu-latest
    env:
      ORIG_KEY: ${{ secrets.ORIG_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Fork PRs have no access to secrets, so they cannot decrypt the original
      # DOL. Skip the build there rather than fail; the decomp.dev report is
      # produced from same-repo runs on `main`.
      - name: Check for original DOL key
        id: haskey
        run: |
          if [ -n "$ORIG_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORIG_KEY secret unavailable (fork PR?); skipping build."
          fi

      - name: Set up Rust
        if: steps.haskey.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache patched dtk build
        if: steps.haskey.outputs.available == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: /tmp/decomp-toolkit

      - name: Decrypt original DOL
        if: steps.haskey.outputs.available == 'true'
        run: bash tools/orig_crypt.sh decrypt

      # LSW1 needs a patched dtk that tolerates this ProDG binary's exception
      # tables (stock dtk panics, producing empty target objects). Built from a
      # pinned source ref + tools/patches/. See docs/development_workflow.md.
      - name: Build patched dtk
        if: steps.haskey.outputs.available == 'true'
        run: bash tools/build_patched_dtk.sh

      - name: Configure and download tools
        if: steps.haskey.outputs.available == 'true'
        run: |
          python3 configure.py
          ninja build/tools/objdiff-cli build/tools/wibo \
                build/binutils build/compilers

      - name: Split DOL (native dtk dol split)
        if: steps.haskey.outputs.available == 'true'
        run: ninja build/GL5E4F/config.json

      - name: Build progress report
        if: steps.haskey.outputs.available == 'true'
        run: ninja build/GL5E4F/report.json

      - name: Summarize progress
        if: steps.haskey.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("build/GL5E4F/report.json"))["measures"]
          pct = m.get("matched_code_percent", 0.0)
          print(f"matched code: {pct:.2f}%  "
                f"({int(m.get('matched_code',0)):,}/{int(m.get('total_code',0)):,} bytes, "
                f"{int(m.get('matched_functions',0))}/{int(m.get('total_functions',0))} funcs)")
          PY

      # decomp.dev ingests this artifact. The name must follow the
      # <VERSION>_report convention.
      - name: Upload progress report
        if: steps.haskey.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GL5E4F_report
          path: build/GL5E4F/report.json
          if-no-files-found: error
