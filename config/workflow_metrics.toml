# Cohorts and comparisons for tools/workflow_metrics.py (definitions: docs/workflow_metrics.md).
#
# A cohort is a list of bench-run segments: a run id from work/sprint_bench*.jsonl or
# <bench cache>/events/, optionally cut to [since, until] (ISO 8601 with offset) when one log
# holds several agents' work. Add a cohort for each workflow change you measure and a
# comparison naming its before and after cohorts; the run ids come from
# `python3 tools/workflow_metrics.py report`.

