# The matching plan, in order. docs/strategy.md explains it; tools/plan.py reads it.
#
# Stages run in file order; items within a stage run in file order. The current stage is the
# first one that is not closed. Progress is never typed here: an item's remaining bytes and
# functions come from build/GL5E4F/report.json (a function is done when its fuzzy match is
# 100%), so this file only changes when the plan does.
#
# An item names `units` (every function of those report units) or `functions` (symbol names).
# It is closed when each of its functions is matched in the report or listed in [[parked]].
# A stage is closed when all its items are closed. A stage with `alongside = true` is not the
# current stage; its open items are worked beside the current stage's and come first. `blocked` marks an item that has no known
# route yet; tools never recommend it, and a stage left with only blocked items needs a plan
# revision. The `data` item measures the report's data bytes instead of functions.
#
# Claims: an item is claimed by the worktree that ran `kickoff.py --start --item ID` (recorded
# in the git common directory, so every local worktree sees it) or by an unmerged branch or open
# PR named `t3/plan-ID`. A claim ends when its branch merges into origin/main.
#
# Revise this file (bump `revision`, say why in the PR, update docs/strategy.md) when a tool
# reports that the plan needs revision, or when evidence changes the order. Parking a function
# needs a reason that names its best score and the next hypothesis.

revision = 9
# The `# at revision N` comments record each item's size when the plan was written; they are
# not read by tools.

# [[parked]]
# function = "fn_XXXXXXXX"
# reason = "best 52/57; r27/r28 swap of ...; next: ..."

