# at revision 1: 20 functions, 11,616 bytes left

[[parked]]
function = "fn_80023628"
reason = "Strict VERIFIED and its .rodata pool now matches; objdiff stays at 99.96% only because the farclip read relocates as lbl_80313268+0x4c where the retail split names the same address lbl_803132B4 (struct nucam_s spans the 0x20-byte lbl_80313268 symbol). The linked address is identical. Next: settle the .bss symbol boundary at 0x80313268 with runtime or caller evidence, never by faking a separate extern."

[[parked]]
function = "fn_80022DE8"
reason = "Best 146/149, score [1,6,0,-146,0] (NONMATCHING draft in src/auto/nu3d/ngc/nucamera.c, kept unguarded because its 8192.0f/0.0f pool entries are part of the unit .rodata). Writing rot_xy straight through v fixed the loop instance register swap. The only remaining difference is the first block after the second NuFsqrt: retail schedules the p->x store directly after fctiwz and loads ang.y (lfs f31) before mr r3,r30. Plateau: over 25 distinct hypotheses (store orders, chained/split zero stores, a len temporary, ternary clamp, f32 ang[2]/[3], ang pointer inline, local declaration orders, comma expressions) and a 13k-iteration 180 s permuter burst on the block found nothing better. Next: a scheduler-aware search (e.g. different inline parameter shapes for the first call only) or a different source form for the first rotation."

